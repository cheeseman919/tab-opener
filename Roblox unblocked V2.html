<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      background: #f2f2f2;
    }
    button {
      font-size: 24px;
      padding: 18px 40px;
      background: #4285F4;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<button onclick="openTabs()">Log In</button>

<script>
  // CHANGE THIS NUMBER
  let numberOfTabs = 3;

  function openTabs() {
    for (let i = 0; i < numberOfTabs; i++) {
      window.open("https://www.google.com", "_blank");
    }
  }
</script>

</body>
</html>
