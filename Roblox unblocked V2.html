<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    button {
      padding: 18px 40px;
      font-size: 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #4285F4;
      color: white;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<button onclick="openTabs()">Log In</button>

<script>
  // CHANGE THIS NUMBER
  let numberOfTabs = 5;

  function openTabs() {
    for (let i = 0; i < numberOfTabs; i++) {
      setTimeout(() => {
        window.open("https://www.google.com", "_blank");
      }, i * 200);
    }
  }
</script>

</body>
</html>
