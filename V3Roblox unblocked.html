<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Virus Prank</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
    font-family: Arial, sans-serif;
  }

  button {
    font-size: 30px;
    padding: 20px 50px;
    border: none;
    border-radius: 12px;
    background: red;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 25px red;
  }
</style>
</head>
<body>

<button id="startBtn">CLICK TO FIX VIRUS</button>

<script>
  // =========================
  // CHANGE THIS NUMBER
  // =========================
  const WINDOW_COUNT = 4;
  // =========================

  document.getElementById("startBtn").onclick = () => {

    for (let i = 0; i < WINDOW_COUNT; i++) {

      const newWindow = window.open("", "_blank",
        `width=500,height=400,left=${Math.random()*800},top=${Math.random()*500}`
      );

      if (!newWindow) continue;

      newWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
        <title>WARNING</title>

        <style>
          body {
            margin: 0;
            overflow: hidden;
            background: black;
            color: lime;
            font-family: Arial;
          }

          .popup {
            position: absolute;
            width: 280px;
            background: #111;
            border: 3px solid red;
            padding: 15px;
            box-shadow: 0 0 20px red;
            animation: shake 0.15s infinite;
          }

          .title {
            background: red;
            color: white;
            padding: 5px;
            font-weight: bold;
          }

          button {
            margin-top: 10px;
            padding: 5px 10px;
          }

          @keyframes shake {
            0% { transform: translate(1px,1px); }
            25% { transform: translate(-2px,1px); }
            50% { transform: translate(2px,-1px); }
            75% { transform: translate(-1px,2px); }
            100% { transform: translate(1px,-2px); }
          }
        </style>
        </head>

        <body>

        <script>

          // Fullscreen
          document.documentElement.requestFullscreen?.();

          function createPopup() {

            const popup = document.createElement("div");
            popup.className = "popup";

            popup.style.left =
              Math.random() * (window.innerWidth - 300) + "px";

            popup.style.top =
              Math.random() * (window.innerHeight - 200) + "px";

            popup.innerHTML = \`
              <div class="title">⚠ VIRUS DETECTED ⚠</div>
              <p>Deleting files...</p>
              <p>IP leaked.</p>
              <button onclick="this.parentElement.remove()">
                Fix Now
              </button>
            \`;

            document.body.appendChild(popup);
          }

          setInterval(createPopup, 500);

        <\/script>

        </body>
        </html>
      `);
    }
  };
</script>

</body>
</html>
