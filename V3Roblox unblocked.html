<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Virus Prank</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
    font-family: Arial, sans-serif;
  }

  button {
    font-size: 28px;
    padding: 20px 40px;
    border: none;
    border-radius: 12px;
    background: red;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 20px red;
  }
</style>
</head>
<body>

<button id="startBtn">CLICK TO FIX VIRUS</button>

<script>
  // ==========================
  // CHANGE THIS NUMBER
  // ==========================
  const TAB_COUNT = 10;
  // ==========================

  document.getElementById("startBtn").onclick = () => {

    // The prank page content
    const prankHTML = `
<!DOCTYPE html>
<html>
<head>
<title>WARNING</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: Arial;
    color: lime;
  }

  .popup {
    position: absolute;
    width: 280px;
    background: #111;
    border: 3px solid red;
    box-shadow: 0 0 20px red;
    padding: 15px;
    animation: shake 0.15s infinite;
  }

  .title {
    background: red;
    color: white;
    padding: 5px;
    font-weight: bold;
  }

  button {
    margin-top: 10px;
    padding: 5px 10px;
    cursor: pointer;
  }

  @keyframes shake {
    0% { transform: translate(1px,1px); }
    25% { transform: translate(-2px,1px); }
    50% { transform: translate(2px,-1px); }
    75% { transform: translate(-1px,2px); }
    100% { transform: translate(1px,-2px); }
  }
</style>
</head>

<body>

<script>

  // Try fullscreen
  document.documentElement.requestFullscreen?.();

  function createPopup() {

    const div = document.createElement("div");
    div.className = "popup";

    div.style.left =
      Math.random() * (window.innerWidth - 300) + "px";

    div.style.top =
      Math.random() * (window.innerHeight - 180) + "px";

    div.innerHTML = \`
      <div class="title">⚠ VIRUS DETECTED ⚠</div>
      <p>Deleting files...</p>
      <p>IP leaked...</p>
      <button onclick="this.parentElement.remove()">
        Fix Now
      </button>
    \`;

    document.body.appendChild(div);
  }

  setInterval(createPopup, 500);

<\/script>

</body>
</html>
`;

    // Convert HTML into a temporary URL
    const blob = new Blob([prankHTML], { type: "text/html" });
    const url = URL.createObjectURL(blob);

    // Open lots of tabs
    for (let i = 0; i < TAB_COUNT; i++) {
      window.open(url, "_blank");
    }
  };
</script>

</body>
</html>
