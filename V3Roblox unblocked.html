<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>unblocked Roblox</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }
  </style>
</head>

<body>

<button onclick="prank()">log in</button>

<script>
  // CHANGE THIS NUMBER to control how many tabs open
  const tabAmount = 3;

  function prank() {
    for (let i = 0; i < tabAmount; i++) {
      const newTab = window.open();
      newTab.document.write(`
        <html>
          <head>
            <title>Virus Alert</title>
            <style>
              body {
                background: black;
                color: red;
                font-family: Arial;
                text-align: center;
                padding-top: 20%;
              }
            </style>
          </head>
          <body>
            <h1>⚠ VIRUS DETECTED ⚠</h1>
            <p>This is a fake alert for a prank 😄</p>
          </body>
        </html>
      `);
    }
  }
</script>

</body>
</html>
