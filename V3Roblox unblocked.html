<!DOCTYPE html>
<html>
<head>
  <title>Unblocked roblox</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    button {
      background: red;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 24px;
      border-radius: 12px;
      cursor: pointer;
    }

    button:hover {
      background: darkblue;
    }
  </style>
</head>

<body>

<button onclick="openTabs()">
  Log in
</button>

<script>
function openTabs() {
  // 🔢 change this number safely (max 5 recommended)
  let amount = 5;

  // safety limit so it doesn't crash the browser
  amount = Math.min(amount, 5);

  for (let i = 0; i < amount; i++) {
    window.open("https://www.google.com", "_blank");
  }

  // fullscreen current page
  const el = document.documentElement;

  if (el.requestFullscreen) {
    el.requestFullscreen();
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  } else if (el.msRequestFullscreen) {
    el.msRequestFullscreen();
  }
}
</script>

</body>
</html>
