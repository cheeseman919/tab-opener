<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Virus Prank</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
    font-family: Arial, sans-serif;
  }

  button {
    font-size: 28px;
    padding: 20px 40px;
    border: none;
    border-radius: 12px;
    background: red;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 20px red;
  }
</style>
</head>
<body>

<button id="startBtn">CLICK TO FIX VIRUS</button>

<script>
  // ==========================
  // CHANGE THIS NUMBER
  // ==========================
  const WINDOW_COUNT = 10;
  // ==========================

  document.getElementById("startBtn").onclick = () => {

    for (let i = 0; i < WINDOW_COUNT; i++) {

      // Opens separate popup-style browser windows
      const prankWindow = window.open(
        "",
        "",
        `
        width=500,
        height=400,
        left=${Math.random() * 1000},
        top=${Math.random() * 600},
        popup=yes
        `
      );

      if (!prankWindow) continue;

      prankWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
        <title>WARNING</title>

        <style>
          body {
            margin: 0;
            background: black;
            overflow: hidden;
            font-family: Arial;
            color: lime;
          }

          .popup {
            position: absolute;
            width: 280px;
            background: #111;
            border: 3px solid red;
            box-shadow: 0 0 20px red;
            padding: 15px;
            animation: shake 0.15s infinite;
          }

          .title {
            background: red;
            color: white;
            padding: 5px;
            font-weight: bold;
          }

          button {
            margin-top: 10px;
            padding: 5px 10px;
            cursor: pointer;
          }

          @keyframes shake {
            0% { transform: translate(1px,1px); }
            25% { transform: translate(-2px,1px); }
            50% { transform: translate(2px,-1px); }
            75% { transform: translate(-1px,2px); }
            100% { transform: translate(1px,-2px); }
          }
        </style>
        </head>

        <body>

        <script>

          // Fullscreen
          document.documentElement.requestFullscreen?.();

          function createPopup() {

            const div = document.createElement("div");
            div.className = "popup";

            div.style.left =
              Math.random() * (window.innerWidth - 300) + "px";

            div.style.top =
              Math.random() * (window.innerHeight - 180) + "px";

            div.innerHTML = \`
              <div class="title">⚠ VIRUS DETECTED ⚠</div>
              <p>System compromised...</p>
              <p>Deleting files...</p>
              <button onclick="this.parentElement.remove()">
                Fix Now
              </button>
            \`;

            document.body.appendChild(div);
          }

          setInterval(createPopup, 500);

        <\/script>

        </body>
        </html>
      `);
    }
  };
</script>

</body>
</html>
