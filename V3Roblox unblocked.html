<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Totally Real Virus</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: lime;
  }

  .popup {
    position: absolute;
    width: 300px;
    background: #111;
    border: 3px solid red;
    box-shadow: 0 0 20px red;
    padding: 15px;
    animation: shake 0.15s infinite;
  }

  .title {
    color: white;
    background: red;
    padding: 5px;
    font-weight: bold;
  }

  button {
    margin-top: 10px;
    padding: 5px 10px;
    cursor: pointer;
  }

  @keyframes shake {
    0% { transform: translate(1px, 1px); }
    25% { transform: translate(-1px, 2px); }
    50% { transform: translate(2px, -1px); }
    75% { transform: translate(-2px, 1px); }
    100% { transform: translate(1px, -2px); }
  }

  #matrix {
    position: fixed;
    inset: 0;
    color: lime;
    font-size: 18px;
    opacity: 0.15;
    white-space: pre;
    pointer-events: none;
  }

  #startScreen {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  #startBtn {
    font-size: 28px;
    padding: 20px 40px;
    background: red;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 12px;
  }
</style>
</head>
<body>

<div id="startScreen">
  <button id="startBtn">CLICK TO FIX VIRUS</button>
</div>

<div id="matrix"></div>

<script>
  const startBtn = document.getElementById("startBtn");

  startBtn.onclick = async () => {

    // Try fullscreen
    if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    }

    // Remove start screen
    document.getElementById("startScreen").remove();

    startPrank();
  };

  function startPrank() {

    // Fake matrix background
    const matrix = document.getElementById("matrix");
    let text = "";

    for (let i = 0; i < 500; i++) {
      text += Math.random() > 0.5 ? "1" : "0";
      if (i % 50 === 0) text += "\n";
    }

    matrix.textContent = text;

    // Create fake virus popups
    function createPopup() {
      const popup = document.createElement("div");
      popup.className = "popup";

      popup.style.left =
        Math.random() * (window.innerWidth - 320) + "px";

      popup.style.top =
        Math.random() * (window.innerHeight - 180) + "px";

      popup.innerHTML = `
        <div class="title">⚠ SYSTEM FAILURE ⚠</div>
        <p>Virus detected on device.</p>
        <p>Deleting files...</p>
        <button>Fix Now</button>
      `;

      popup.querySelector("button").onclick = () => {
        popup.remove();
      };

      document.body.appendChild(popup);
    }

    setInterval(createPopup, 700);

    // Fake warning sounds
    setInterval(() => {
      const audio = new Audio(
        "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAAAA"
      );
      audio.play();
    }, 2000);
  }
</script>

</body>
</html>
